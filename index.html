<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <main>
            <!-- Input Section -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Statistics -->
            <div class="stats">
                <span class="stat-item">
                    <strong id="totalCount">0</strong> Total
                </span>
                <span class="stat-item">
                    <strong id="activeCount">0</strong> Active
                </span>
                <span class="stat-item">
                    <strong id="completedCount">0</strong> Completed
                </span>
            </div>

            <!-- Task List -->
            <div id="taskList" class="task-list">
                <p class="empty-message">No tasks yet. Add one to get started!</p>
            </div>

            <!-- Clear Completed Button -->
            <button id="clearBtn" class="clear-btn" style="display: none;">
                Clear Completed Tasks
            </button>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
