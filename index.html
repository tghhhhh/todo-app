<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List with Time Tracking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay organized and track your time</p>
        </header>

        <main>
            <!-- Input Section -->
            <div class="input-section">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Add a new task..." 
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Statistics -->
            <div class="stats">
                <span class="stat-item">
                    <strong id="totalCount">0</strong> Total
                </span>
                <span class="stat-item">
                    <strong id="activeCount">0</strong> Active
                </span>
                <span class="stat-item">
                    <strong id="completedCount">0</strong> Completed
                </span>
            </div>

            <!-- Task List -->
            <div id="taskList" class="task-list">
                <p class="empty-message">No tasks yet. Add one to get started!</p>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearBtn" class="clear-btn" style="display: none;">
                    Clear Completed Tasks
                </button>
            </div>

            <!-- Backup & Export Section -->
            <div class="backup-section">
                <h3>💾 Backup & Export</h3>
                <div class="backup-buttons">
                    <button id="exportBtn" class="export-btn" title="Download tasks as JSON file">
                        📥 Export Tasks
                    </button>
                    <button id="importBtn" class="import-btn" title="Load tasks from JSON file">
                        📤 Import Tasks
                    </button>
                    <button id="statsBtn" class="stats-btn" title="View storage statistics">
                        📊 Storage Info
                    </button>
                </div>
                <input 
                    type="file" 
                    id="importFile" 
                    accept=".json" 
                    style="display: none;"
                >
                <div id="storageInfo" class="storage-info" style="display: none;">
                    <p><strong>Storage Usage:</strong> <span id="storageUsed">0</span> KB</p>
                    <p><strong>Available Space:</strong> ~<span id="storageAvailable">5000</span> KB</p>
                    <p><strong>Usage Percentage:</strong> <span id="storagePercent">0</span>%</p>
                    <div class="storage-bar">
                        <div id="storageBar" class="storage-fill"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Time Picker -->
    <div id="timeModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Set Time</h2>
            <div class="time-inputs">
                <div class="time-group">
                    <label for="startTimeInput">Start Time:</label>
                    <input type="datetime-local" id="startTimeInput" class="time-input">
                </div>
                <div class="time-group">
                    <label for="endTimeInput">End Time:</label>
                    <input type="datetime-local" id="endTimeInput" class="time-input">
                </div>
            </div>
            <div class="modal-buttons">
                <button id="saveTimes" class="save-btn">Save Times</button>
                <button id="clearTimes" class="clear-time-btn">Clear Times</button>
            </div>
            <div id="durationDisplay" class="duration-display"></div>
        </div>
    </div>

    <!-- Hidden Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
